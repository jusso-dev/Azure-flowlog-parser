[package]
name = "azure-flowlog-parser"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Discover Azure VNet flow log storage accounts and build traffic reports (HTML or PDF) between them"
publish = false

[[bin]]
name = "azure-flowlog-parser"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
fastrand = "2"
flate2 = "1"
futures = "0.3"
quick-xml = { version = "0.42", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "process"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
