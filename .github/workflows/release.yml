# Release pipeline: runs when a tag matching v* is pushed.
#
# The build job calls ci.yml, so a release ships exactly the binaries that CI
# builds and tests. The release job runs only if every CI job passes. It is
# the only job with contents: write. It creates the GitHub release with the
# binaries and a SHA256SUMS file.
#
# Release assets:
#   azure-flowlog-parser-dotnet-linux-x64
#   azure-flowlog-parser-dotnet-win-x64.exe
#   azure-flowlog-parser-dotnet-osx-arm64
#   azure-flowlog-parser-rust-linux-x64
#   azure-flowlog-parser-rust-linux-x64-musl
#   azure-flowlog-parser-rust-win-x64.exe
#   azure-flowlog-parser-rust-osx-arm64
#   SHA256SUMS
#
# Jobs:
#   build    calls ci.yml (all test and build jobs).
#   release  downloads the bin-* artifacts, writes SHA256SUMS, creates the
#            release from the tag and uploads the assets.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: assets
      - name: Write SHA-256 checksums
        working-directory: assets
        run: sha256sum azure-flowlog-parser-* > SHA256SUMS
      - name: Create release (skipped when it already exists, so reruns work)
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
      - name: Upload assets (replaces existing assets on rerun)
        run: gh release upload "$GITHUB_REF_NAME" assets/* --clobber
